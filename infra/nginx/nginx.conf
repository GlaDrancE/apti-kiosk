server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed asset filenames are immutable; index.html must never be cached or
  # returning students would keep loading a stale build mid-exam window.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # The API container is reached through the same origin, so the browser makes
  # no cross-origin request and CORS never enters the picture in production.
  location /api/ {
    proxy_pass http://api:4000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # CSV exports of a large cohort can take a while to assemble.
    proxy_read_timeout 120s;
  }

  # SPA fallback: every unknown path is a client-side route.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
